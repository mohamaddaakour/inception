; This configuration tells PHP-FPM how to run WordPress PHP processes,
; how many workers it can create, which database environment variables to pass,
; and how to handle errors.

; Define the PHP-FPM worker pool named "www".
[www]

; Run PHP worker processes as the www-data user and group.
user = www-data
group = www-data

; Listen for FastCGI connections on port 9000.
; 0.0.0.0 allows connections through all container IPv4 interfaces.
; The port is accessible to containers on permitted Docker networks,
; but it is not published to the host.
listen = 0.0.0.0:9000

; Create PHP worker processes only when requests arrive.
; This helps reduce resource usage when the application is idle.
pm = ondemand

; Allow a maximum of 5 PHP worker processes at the same time.
pm.max_children = 5

; Terminate idle worker processes after 10 seconds.
pm.process_idle_timeout = 10s

; Remove inherited environment variables from PHP worker processes.
; Only variables explicitly passed using env[] will be available.
clear_env = yes

; Pass the database connection configuration to PHP workers.
; These values come from the PHP-FPM process environment.
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER

; Pass the path to the database password secret file.
; This contains the file path, not the password itself.
env[DB_PASSWORD_FILE] = $DB_PASSWORD_FILE

; Capture worker stdout and stderr in the PHP-FPM error log.
; Useful for debugging application problems.
catch_workers_output = yes

; Disable displaying PHP errors to users.
; Errors can still be recorded in logs if logging is enabled.
; php_admin_flag prevents PHP scripts from overriding this setting.
php_admin_flag[display_errors] = off
