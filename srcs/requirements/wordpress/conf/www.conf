[www]
; Run request workers without root privileges.
user = www-data
group = www-data
listen = 0.0.0.0:9000
; Expose readiness only through the internal FastCGI listener.
ping.path = /ping
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
; Forward only the required database settings.
clear_env = yes
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD_FILE] = $DB_PASSWORD_FILE
; Send errors to container logs without exposing them to visitors.
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
; Keep PHP upload limits within the gateway's request limit.
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[cgi.fix_pathinfo] = 0
