; Configure PHP-FPM to manage PHP processes and handle application settings.

[www]
; Run request workers as non-root user for security.
user = www-data
group = www-data
listen = 0.0.0.0:9000
; Expose health check endpoint through FastCGI.
ping.path = /ping
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
; Forward only essential environment variables.
clear_env = yes
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD_FILE] = $DB_PASSWORD_FILE
env[REDIS_HOST] = $REDIS_HOST
env[REDIS_PORT] = $REDIS_PORT
env[REDIS_PASSWORD_FILE] = $REDIS_PASSWORD_FILE
; Send errors to container logs and hide them from visitors.
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
; Set upload limits within the container's request limit.
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[cgi.fix_pathinfo] = 0
