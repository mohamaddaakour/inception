# Default Nginx configuration file for serving a static site
server {
    # Default server configuration
    listen 8080 default_server;
    server_name _;

    # Set the root directory for serving static files
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Handle requests for the root location
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files (e.g., .htaccess, .git)
    location ~ /\. {
        deny all;
    }
}
