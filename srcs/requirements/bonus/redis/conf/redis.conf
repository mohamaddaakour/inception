# Listen on all container interfaces.
bind 0.0.0.0
port 6379

# In Docker bridge network, rely on password authentication and isolation.
protected-mode no

# Run in foreground so Redis is PID 1.
daemonize no

# Restrict memory footprint and evict least recently used keys when full.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Ephemeral object cache: disable disk snapshotting.
save ""

# Log to stdout for Docker logging.
logfile ""