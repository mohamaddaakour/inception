# Listen on all container interfaces.
bind 0.0.0.0

# Listen on the default Redis port.
port 6379

# In Docker bridge network, rely on password authentication and isolation.
protected-mode no

# Run in foreground so Redis is PID 1.
daemonize no

# Restrict memory footprint
maxmemory 256mb

# Use an eviction policy that removes the least recently used keys when memory limit is reached.
maxmemory-policy allkeys-lru

# disable disk snapshotting.
save ""

# Log to stdout for Docker logging.
logfile ""