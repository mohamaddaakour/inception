# Set the name of the Docker Compose project to "inception".
name: inception

# Define the containers (services) that make up our application.
services:

  # MariaDB: Database server
  mariadb:

    # Name and tag of the Docker image for our MariaDB service.
    image: mariadb:inception

    # Never download this image from a remote registry.
    # Only use an image available locally or build it from the Dockerfile.
    pull_policy: never

    # Path to the directory containing the MariaDB Dockerfile.
    # The path is relative to the directory of this Compose file.
    build: ./requirements/mariadb

    # Always restart the container unless we stopped it manually.
    restart: unless-stopped

    # controls how long Docker patiently waits for
    # a process to shut down cleanly before killing it by force.
    stop_grace_period: 30s

    # Define environment variables available inside the container.
    environment:

      # Read DB_NAME from the .env file and pass it to the container.
      # If it is missing or empty, Compose stops with the given error.
      DB_NAME: ${DB_NAME:?Set DB_NAME}

      DB_USER: ${DB_USER:?Set DB_USER}

    # Make the db_password secret available inside the container.
    secrets: [db_password]

    # Mount persistent storage inside the container.
    volumes:

      # Mount the named volume "database" at /var/lib/mysql.
      # MariaDB stores its database files in this directory.
      # The data survives container removal and recreation.
      - database:/var/lib/mysql

    # Connect MariaDB to the custom "inception" network.
    # Other containers on this network can reach it using "mariadb".
    networks: [inception]

    # Define how Docker checks whether MariaDB is healthy.
    healthcheck:

      # Execute a shell command inside the container.
      test:
        - CMD-SHELL
        - >-
          test -f /var/lib/mysql/.inception-ready &&
          mariadb --protocol=socket -uroot -Nse 'SELECT 1' >/dev/null

      # Run the health check every 5 seconds.
      interval: 5s

      # Each health check must finish within 3 seconds.
      timeout: 3s

      # Mark unhealthy after 20 consecutive failures,
      # subject to the start-period behavior.
      retries: 20

      # Allow 30 seconds for startup.
      # Failures during this period do not count toward retries.
      # A successful check ends the grace period early.
      start_period: 30s
  
  redis:
    # Custom Redis caching server built from Debian.
    image: redis:inception

    pull_policy: never

    build: ./requirements/bonus/redis

    restart: unless-stopped

    stop_grace_period: 10s

    secrets: [redis_password]

    networks: [inception]

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG

      interval: 5s

      timeout: 3s

      retries: 20

      start_period: 10s

  # WordPress: PHP-FPM application server
  wordpress:

    image: wordpress:inception

    pull_policy: never

    build: ./requirements/wordpress

    restart: unless-stopped

    stop_grace_period: 30s

    environment:

      # Database hostname.
      # Docker's internal DNS resolves "mariadb" to the MariaDB
      # container on the shared inception network.
      DB_HOST: mariadb

      DB_NAME: ${DB_NAME:?Set DB_NAME}

      DB_USER: ${DB_USER:?Set DB_USER}

      # Path where the application expects to read its password.
      # This variable does not contain the password itself.
      # The file where the password will be stored inside the container.
      DB_PASSWORD_FILE: /run/credentials/db_password

      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE:?Set WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?Set WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER:?Set WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?Set WP_USER_EMAIL}

      # Redis object cache hostname and port inside the compose network.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      REDIS_PASSWORD_FILE: /run/credentials/redis_password

    # Mount the database, account, and Redis password secrets.
    secrets: [db_password, wp_admin_password, wp_user_password, redis_password]

    # Mount persistent website storage.
    volumes:

      # Mount the website volume at /var/www/html.
      # This directory normally contains WordPress files,
      # plugins, themes, uploads, and other website content.
      - website:/var/www/html

    # Connect WordPress to the same internal network as MariaDB.
    networks: [inception]

    # Control the order and readiness of service startup.
    depends_on:

      # WordPress depends on MariaDB.
      mariadb:

        # Wait until MariaDB's healthcheck reports "healthy"
        # before starting WordPress.
        condition: service_healthy

      # WordPress also depends on Redis for object caching.
      redis:

        # Wait until Redis's healthcheck reports "healthy",
        # which also proves password authentication works.
        condition: service_healthy

    # Check whether the PHP-FPM application is responding.
    healthcheck:

      # Run the following shell command inside WordPress.
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_URI=/ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong

      interval: 5s

      timeout: 5s

      retries: 20

      start_period: 30s

  # NGINX: HTTPS web server and reverse proxy
  nginx:

    image: nginx:inception

    pull_policy: never

    build: ./requirements/nginx

    restart: unless-stopped

    stop_grace_period: 15s

    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME}

    # Publish container ports to the host machine.
    ports:

      # Map host port 443 to container port 443.
      # Format: "HOST_PORT:CONTAINER_PORT"
      # This allows HTTPS connections to reach NGINX.
      - "443:443"

    # Mount the website files.
    volumes:

      # Share the WordPress website volume with NGINX.
      # :ro means read-only.
      # NGINX can read the files but cannot modify them
      # through this mount.
      - website:/var/www/html:ro

    # Connect NGINX to the same inception network.
    networks: [inception]

    depends_on:

      wordpress:
        condition: service_healthy

    # Check whether NGINX responds to HTTPS requests.
    healthcheck:

      # Run curl inside the NGINX container.
      test:
        - CMD-SHELL
        - >-
          curl --noproxy '*' -fkSs --max-time 4
          --resolve "$${DOMAIN_NAME}:443:127.0.0.1"
          "https://$${DOMAIN_NAME}/" >/dev/null

      interval: 5s

      timeout: 5s

      retries: 15

# Networks: Communication between containers
networks:

  # Logical name of the network used by the services.
  inception:

    # Create a user-defined bridge network.
    # Containers connected to this network can communicate
    # using service names such as "mariadb" and "wordpress".
    #
    # The network is isolated from other Docker networks
    # by default, but it is not disconnected from the internet.
    driver: bridge

# Volumes: Persistent data storage
volumes:

  # Named volume for MariaDB database files.
  database:

    # Explicit Docker volume name.
    # Prevents Compose from automatically prefixing
    # this volume name with the project name.
    name: inception_database

  # Named volume for WordPress website files.
  website:

    # Explicit Docker volume name.
    name: inception_website

# Secrets: Sensitive configuration data
secrets:

  # Define a secret containing the database password.
  db_password:

    # Read the password from this file on the host.
    # The path is relative to the Compose file directory.
    file: ./secrets/db_password.txt

  # Provide the password used when creating the WordPress administrator.
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt

  # Provide the password used when creating the WordPress subscriber.
  wp_user_password:
    file: ./secrets/wp_user_password.txt

  # Provide the password protecting the Redis caching service.
  redis_password:
    file: ./secrets/redis_password.txt
